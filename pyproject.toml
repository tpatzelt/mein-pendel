[project]
name = "mein-pendel"
version = "0.1.0"
description = "Personal BVG/S-Bahn disruption alerts for Berlin commuters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pendel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
