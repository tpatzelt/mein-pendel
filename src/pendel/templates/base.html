<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t("app_title") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    {% block footer %}
    <p>{{ t("footer_text") }}</p>
    <nav>
      <a href="/impressum">{{ t("footer_impressum") }}</a>
      <a href="/datenschutz">{{ t("footer_datenschutz") }}</a>
      <a href="/about">{{ t("footer_about") }}</a>
    </nav>
    {% endblock %}
  </footer>
</body>
</html>
